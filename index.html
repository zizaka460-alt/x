<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRYSQUAD</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050505; --acid:#c6ff00; --pink:#ff2bd6; --ice:#7df9ff; --white:#f2f2f2;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--bg); color:var(--white);
  font-family:'Space Mono',monospace;
  overflow-x:hidden; cursor:crosshair;
}
/* зерно + сканлайны */
#noise{position:fixed;inset:0;pointer-events:none;z-index:50;opacity:.12;mix-blend-mode:screen}
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:49;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px);
}
a{color:inherit;text-decoration:none}

/* NAV */
nav{
  position:fixed;top:0;left:0;right:0;z-index:40;
  display:flex;justify-content:space-between;align-items:center;
  padding:14px 28px;mix-blend-mode:difference;
  font-weight:700;text-transform:uppercase;font-size:13px;
}
nav .logo{font-family:'Unbounded';font-weight:900;font-size:18px}
nav ul{display:flex;gap:22px;list-style:none}
nav a:hover{color:var(--acid);text-decoration:line-through}

/* HERO */
.hero{
  min-height:100vh;display:grid;place-items:center;text-align:center;
  position:relative;padding:120px 20px 80px;overflow:hidden;
  background:
    radial-gradient(circle at 20% 30%,rgba(255,43,214,.25),transparent 40%),
    radial-gradient(circle at 80% 70%,rgba(198,255,0,.18),transparent 40%);
}
.hero h1{
  font-family:'Unbounded';font-weight:900;
  font-size:clamp(48px,14vw,200px);line-height:.9;letter-spacing:-.04em;
  position:relative;display:inline-block;
  background:linear-gradient(180deg,#fff 0%,#9aa 45%,#222 50%,#cfd 55%,#fff 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 20px rgba(125,249,255,.35));
}
.glitch::before,.glitch::after{
  content:attr(data-t);position:absolute;inset:0;
  background:inherit;-webkit-background-clip:text;background-clip:text;color:transparent;
}
.glitch::before{left:4px;text-shadow:-3px 0 var(--pink);clip-path:inset(0 0 60% 0);animation:g1 2.2s infinite steps(1)}
.glitch::after{left:-4px;text-shadow:3px 0 var(--ice);clip-path:inset(60% 0 0 0);animation:g2 1.7s infinite steps(1)}
@keyframes g1{0%{clip-path:inset(0 0 80% 0)}20%{clip-path:inset(30% 0 40% 0)}40%{clip-path:inset(70% 0 5% 0)}60%{clip-path:inset(10% 0 60% 0)}80%{clip-path:inset(50% 0 20% 0)}100%{clip-path:inset(0 0 80% 0)}}
@keyframes g2{0%{clip-path:inset(60% 0 0 0)}25%{clip-path:inset(10% 0 70% 0)}50%{clip-path:inset(40% 0 30% 0)}75%{clip-path:inset(80% 0 0 0)}100%{clip-path:inset(60% 0 0 0)}}
.hero p{margin-top:24px;font-size:clamp(13px,1.6vw,18px);color:var(--acid);text-transform:uppercase;letter-spacing:.2em}
.btn{
  display:inline-block;margin-top:36px;padding:16px 34px;
  border:2px solid var(--acid);color:var(--acid);font-weight:700;text-transform:uppercase;
  box-shadow:6px 6px 0 var(--pink);transition:.15s;background:transparent;font-family:inherit;font-size:14px;cursor:pointer;
}
.btn:hover{transform:translate(6px,6px);box-shadow:0 0 0 var(--pink);background:var(--acid);color:#000}

/* кристаллы */
.crystal{
  position:absolute;width:var(--s);height:calc(var(--s)*1.6);
  background:linear-gradient(135deg,#fff,var(--ice) 40%,var(--pink) 80%);
  clip-path:polygon(50% 0,100% 35%,80% 100%,20% 100%,0 35%);
  opacity:.8;animation:float 6s ease-in-out infinite;
  filter:drop-shadow(0 0 12px var(--ice));
}
@keyframes float{50%{transform:translateY(-30px) rotate(12deg)}}

/* MARQUEE */
.marquee{
  background:var(--acid);color:#000;overflow:hidden;white-space:nowrap;
  border-block:3px solid #000;transform:rotate(-1.5deg);margin:40px -10px;
  font-family:'Unbounded';font-weight:900;font-size:26px;padding:10px 0;
}
.marquee.alt{background:var(--pink);transform:rotate(1.2deg)}
.marquee span{display:inline-block;animation:run 18s linear infinite}
.marquee.alt span{animation-direction:reverse}
@keyframes run{to{transform:translateX(-50%)}}

section{padding:90px 28px;max-width:1200px;margin:auto}
h2{
  font-family:'Unbounded';font-weight:900;font-size:clamp(32px,6vw,72px);
  text-transform:uppercase;margin-bottom:40px;letter-spacing:-.03em;
}
h2 em{font-style:normal;color:var(--pink)}

/* ABOUT */
.about{display:grid;grid-template-columns:1.2fr 1fr;gap:40px;align-items:center}
